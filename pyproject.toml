[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reinforcement-learning-based-api-rate-control"
version = "0.2.1"
description = "A reinforcement learning API rate controller with reproducible HTTP experiments"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1",
  "redis==5.2.1", "pydantic==2.11.4", "PyYAML==6.0.2",
  "prometheus-client==0.21.1", "numpy==2.2.5", "matplotlib==3.10.3",
  "psutil==7.0.0",
]

[project.optional-dependencies]
ml = ["torch==2.8.0", "gymnasium==1.2.0", "stable-baselines3==2.7.0", "tensorboard==2.20.0", "scikit-learn==1.7.2"]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.8", "mypy==1.15.0", "types-PyYAML==6.0.12.20250402", "types-psutil==7.0.0.20250401"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
rlrc = "rlrc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rlrc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["redis: requires a running Redis server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
packages = ["rlrc"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["matplotlib.*", "gymnasium.*", "stable_baselines3.*", "sklearn.*", "joblib.*", "threadpoolctl.*", "scipy.*"]
ignore_missing_imports = true
