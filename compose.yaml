services:
  redis:
    image: redis:7.4.11-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 1s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: [rlrc, serve, backend, --host, "0.0.0.0"]
    environment:
      RLRC_ADMIN_TOKEN: ${RLRC_ADMIN_TOKEN:-local-demo-admin}
      RLRC_CONFIG: ${RLRC_CONFIG:-configs/default.yaml}
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 3s
      timeout: 2s
      retries: 15
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      RLRC_REDIS_URL: redis://redis:6379/0
      RLRC_CONFIG: ${RLRC_CONFIG:-configs/default.yaml}
      RLRC_UPSTREAM: http://backend:8001
      RLRC_POLICY: ${RLRC_POLICY:-adaptive}
      RLRC_RATE: ${RLRC_RATE:-100}
      RLRC_NAMESPACE: ${RLRC_NAMESPACE:-demo}
      RLRC_ADMIN_TOKEN: ${RLRC_ADMIN_TOKEN:-local-demo-admin}
    volumes: [./results/runs:/app/results/runs]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 3s
      timeout: 2s
      retries: 15
  prometheus:
    image: prom/prometheus:v3.3.0
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
  runner:
    profiles: [tools]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      RLRC_REDIS_URL: redis://redis:6379/1
      RLRC_ADMIN_TOKEN: ${RLRC_ADMIN_TOKEN:-local-demo-admin}
    volumes: [./results/runs:/app/results/runs]
    entrypoint: [rlrc]
    command: [suite, --scenarios, demo, --repetitions, "1", --rates, "90", "150"]
    depends_on:
      redis: {condition: service_healthy}
